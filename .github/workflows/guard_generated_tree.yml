name: Guard Generated Tree

on:
  push:
    branches: [master]
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          rust-src-dir: create/processor

      - name: Validate Rust pipeline
        env:
          CARGO_BUILD_JOBS: '1'
        run: |
          cargo fmt --manifest-path create/processor/Cargo.toml -- --check
          cargo clippy --manifest-path create/processor/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path create/processor/Cargo.toml --all-targets -- --test-threads=1

      - name: Guard generated-tree edits
        env:
          DIFF_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          DIFF_HEAD: ${{ github.sha }}
          TRUSTED_UPDATER: ${{ github.event_name == 'push' && github.actor == 'github-actions[bot]' }}
        run: cargo run --manifest-path create/processor/Cargo.toml --bin guard

      - name: Validate generated modules
        run: cargo run --manifest-path create/processor/Cargo.toml --bin validate -- --root "$GITHUB_WORKSPACE"
